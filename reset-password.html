<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Bandhu | Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        .auth-wrapper { min-height: calc(100vh - 140px); display: flex; justify-content: center; align-items: center; padding: 2rem 5%; background: linear-gradient(135deg, #f4f7fa 0%, #e2e8f0 100%); }
        .auth-container { background-color: #ffffff; width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(2, 36, 73, 0.08); border: 1px solid #e2e8f0; text-align: center; }
        .auth-logo { height: 55px; width: 55px; object-fit: contain; margin-bottom: 0.75rem; border-radius: 8px; }
        .auth-container h2 { color: #022449; font-size: 1.6rem; margin-bottom: 0.25rem; font-weight: 700; }
        .auth-subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; font-weight: 500; }
        .auth-form { text-align: left; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: #f8fafc; font-size: 0.95rem; transition: border 0.2s; }
        .form-group input:focus { border-color: #0d9488; background: #ffffff; }
        .btn-full { padding: 0.8rem; font-size: 1rem; background-color: #022449; color: #ffffff; border: none; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; box-shadow: 0 4px 6px rgba(2, 36, 73, 0.15); }
        .btn-full:hover { background-color: #01142a; }
        .password-hints { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; padding: 0.6rem; background: #f1f5f9; border-radius: 6px; line-height: 1.5; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>

    <header class="navbar" style="background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo-container" style="display: flex; align-items: center; gap: 10px;">
            <img src="logo.png.jpg" alt="Phone Bandhu Logo" style="height: 40px; width: 40px; object-fit: cover; border-radius: 6px;">
            <div class="logo-text" style="font-size: 1.4rem; font-weight: 800; color: #022449;">Phone<span style="color: #0d9488;">Bandhu</span></div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-container">
            <img src="logo.png.jpg" alt="Phone Bandhu Branding" class="auth-logo">
            <h2>Reset Password</h2>
            <p class="auth-subtitle" id="targetEmailLabel">Account: loading...</p>

            <form id="resetForm" class="auth-form" onsubmit="executePasswordReset(event)">
                <div class="form-group">
                    <label for="newPassword">New Secure Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="newPassword" 
                               placeholder="Minimum 8 characters" 
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#\$%^&+=!]).{8,}"
                               title="Password must contain at least 8 characters, including uppercase, lowercase, number, and special sign."
                               required>
                        <span id="toggleResetPassword" style="position: absolute; right: 12px; cursor: pointer; font-size: 1.1rem; user-select: none; color: #64748b;">👁️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                    <div class="password-hints">
                        🛡️ <b>Maturity Policy Checklist:</b><br>
                        • Must match the exact field value above<br>
                        • Strong sequence complexity layout required
                    </div>
                </div>
                
                <button type="submit" class="btn-full">Update New Password</button>
            </form>
        </div>
    </main>

    <script>
        const API_BASE = `${location.protocol === 'file:' || location.port === '5500' ? 'http://localhost:5200' : location.origin}/api`;
        let targetEmail = "";
        let targetToken = "";

        // 🔗 URL से ईमेल आईडी को अपने आप निकालने का लॉजिक
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            targetEmail = urlParams.get('email');
            targetToken = urlParams.get('token');

            if (targetEmail && targetToken) {
                document.getElementById('targetEmailLabel').innerText = `Account: ${targetEmail}`;
            } else {
                alert("⚠️ Invalid password token or link parameter missing!");
                window.location.href = 'auth.html';
            }
        });

        // 👁️ आँख बटन पासवर्ड टॉगल
        document.getElementById('toggleResetPassword')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('newPassword');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.innerText = '🔒';
            } else {
                passwordInput.type = 'password';
                this.innerText = '👁️';
            }
        });

        // 🚀 बैकएंड पर नया पासवर्ड भेजने का लॉजिक
        async function executePasswordReset(event) {
            event.preventDefault();

            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) {
                alert("⚠️ पासवर्ड मैच नहीं हो रहे हैं! कृपया दोनों बॉक्स में सेम पासवर्ड डालें।");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail, token: targetToken, newPassword: newPass })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(`🎉 ${result.message || 'Password updated successfully!'}`);
                    window.location.href = 'auth.html'; // लॉगिन पर भेजें
                } else {
                    alert(`⚠️ ${result.message || 'Reset failed!'}`);
                }
            } catch (error) {
                console.error('Reset error:', error);
                alert('🔌 कनेक्शन एरर! कृपया पक्का करें कि आपका Node Server बैकग्राउंड में चालू है।');
            }
        }
    </script>
</body>
</html>
