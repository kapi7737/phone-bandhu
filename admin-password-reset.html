<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:5200 http://127.0.0.1:5200">
  <title>Reset Admin Password | PhoneBandhu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{background:#f4f7fa}.reset-card{max-width:560px;margin:7vh auto;padding:28px;background:#fff;border:1px solid #dbe3ec;border-radius:16px;box-shadow:0 12px 32px #02244912}.reset-card h1{color:#022449}.reset-card form{display:grid;gap:12px;margin-top:20px}.reset-card input,.reset-card select{padding:12px;border:1px solid #cbd5e1;border-radius:8px}.reset-card button{padding:12px;border:0;border-radius:8px;background:#022449;color:#fff;font-weight:700;cursor:pointer}.reset-card p{color:#64748b}.message{min-height:24px;color:#b42318}
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Reset an admin password</h1>
    <p>Master admin access is required. Resetting a password signs that admin out of active sessions.</p>
    <form id="resetForm">
      <label for="adminSelect">Admin account</label>
      <select id="adminSelect" required><option value="">Loading admin accounts…</option></select>
      <label for="newPassword">New password (12–72 characters)</label>
      <input id="newPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
      <button type="submit">Reset password</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>
    <a href="admin.html">Back to admin dashboard</a>
  </main>
  <script>
    const apiOrigin = location.protocol === 'file:' ? 'http://localhost:5200' : location.port === '5500' ? `${location.protocol}//${location.hostname}:5200` : location.origin;
    const api = `${apiOrigin}/api`;
    async function call(path, options = {}) {
      const response = await fetch(`${api}${path}`, { credentials: 'include', ...options });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Request failed.');
      return data;
    }
    (async () => {
      const select = document.getElementById('adminSelect');
      try {
        const session = await call('/admin/session');
        if (session.role !== 'master') throw new Error('Sign in as the master admin to use this page.');
        const admins = await call('/admin/admins');
        select.innerHTML = '<option value="">Choose an admin…</option>';
        admins.forEach(admin => {
          const option = document.createElement('option'); option.value = admin._id; option.textContent = `${admin.email} (${admin.status})`;
          if (admin._id === new URLSearchParams(location.search).get('admin')) option.selected = true;
          select.append(option);
        });
        if (!admins.length) select.innerHTML = '<option value="">No admin accounts yet</option>';
      } catch (error) { document.getElementById('message').textContent = error.message; select.innerHTML = '<option value="">Master admin sign in required</option>'; }
    })();
    document.getElementById('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('message'); message.textContent = '';
      try {
        const id = encodeURIComponent(document.getElementById('adminSelect').value);
        const result = await call(`/admin/admins/${id}/password`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('newPassword').value }) });
        event.currentTarget.reset(); message.style.color = '#166534'; message.textContent = result.message;
      } catch (error) { message.style.color = '#b42318'; message.textContent = error.message; }
    });
  </script>
</body>
</html>
