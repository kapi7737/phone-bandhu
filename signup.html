<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://cdn.socket.io; connect-src 'self' http://localhost:5200 http://127.0.0.1:5200 ws://localhost:5200 ws://127.0.0.1:5200 https://api.razorpay.com https://checkout.razorpay.com; frame-src https://*.razorpay.com">
    <title>Phone Bandhu | Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        .auth-wrapper { min-height: calc(100vh - 140px); display: flex; justify-content: center; align-items: center; padding: 2rem 5%; background: linear-gradient(135deg, #f4f7fa 0%, #e2e8f0 100%); }
        .auth-container { background-color: #ffffff; width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(2, 36, 73, 0.08); border: 1px solid #e2e8f0; text-align: center; }
        .auth-logo { height: 55px; width: 55px; object-fit: contain; margin-bottom: 0.75rem; border-radius: 8px; }
        .auth-container h2 { color: #022449; font-size: 1.6rem; margin-bottom: 0.25rem; font-weight: 700; }
        .auth-subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; font-weight: 500; }
        .auth-form { text-align: left; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: #f8fafc; font-size: 0.95rem; transition: border 0.2s; }
        .form-group input:focus { border-color: #0d9488; background: #ffffff; }
        .btn-full { padding: 0.8rem; font-size: 1rem; background-color: #022449; color: #ffffff; border: none; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; box-shadow: 0 4px 6px rgba(2, 36, 73, 0.15); }
        .btn-full:hover { background-color: #01142a; }
        .switch-link { margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; font-weight: 500; }
        .switch-link a { color: #022449; font-weight: 600; text-decoration: none; }
        .switch-link a:hover { text-decoration: underline; }
        .password-hints { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; padding: 0.6rem; background: #f1f5f9; border-radius: 6px; line-height: 1.5; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>

    <header class="navbar" style="background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;">
        <div class="logo-container" style="cursor: pointer; display: flex; align-items: center; gap: 10px;" onclick="window.location.href='index.html'">
            <img src="logo.png.jpg" alt="Phone Bandhu Logo" style="height: 40px; width: 40px; object-fit: cover; border-radius: 6px;">
            <div class="logo-text" style="font-size: 1.4rem; font-weight: 800; color: #022449;">Phone<span style="color: #0d9488;">Bandhu</span></div>
        </div>
        <div class="nav-buttons"><a href="index.html" class="btn btn-secondary" style="padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; text-decoration: none; font-size: 0.9rem;">Back to Home</a></div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-container">
            <img src="logo.png.jpg" alt="Phone Bandhu Branding" class="auth-logo">
            <h2>Create Account</h2>
            <p class="auth-subtitle">सपनों का फोन, जेब के हिसाब से</p>

            <form id="registerForm" class="auth-form" method="post" onsubmit="handleSignUpSubmit(event)">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="e.g., John Doe" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Mobile Number</label>
                    <input type="text" id="regPhone" placeholder="e.g., 9876543210" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Create Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="regPassword" 
                               placeholder="Minimum 12 characters" minlength="12" maxlength="72"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#\$%^&+=!]).{12,}"
                               title="Use at least 12 characters, including uppercase, lowercase, a number, and a special character."
                               style="padding-right: 2.5rem;" required>
                        <span id="toggleSignupPassword" style="position: absolute; right: 12px; cursor: pointer; font-size: 1.1rem; user-select: none; color: #64748b;">👁️</span>
                    </div>
                    <div class="password-hints">
                        🛡️ <b>Maturity Policy Checklist:</b><br>
                        • At least <b>12 characters long</b><br>
                        • Mix of <b>Uppercase (A-Z)</b> & <b>Lowercase (a-z)</b><br>
                        • Include at least one <b>Number (0-9)</b><br>
                        • Include one <b>Special character (@, #, \$, etc.)</b>
                    </div>
                </div>
                
                <button type="submit" class="btn-full">Register Account</button>
            </form>
            
            <div class="switch-link">
                Already have an account? <a href="auth.html">Login here</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        const API_ORIGIN = location.protocol === 'file:' ? 'http://localhost:5200' : location.port === '5500' ? `${location.protocol}//${location.hostname}:5200` : location.origin;
        const API_BASE = `${API_ORIGIN}/api`;
        // 👁️ पासवर्ड शो/हाइड लॉजिक
        document.getElementById('toggleSignupPassword')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('regPassword');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.innerText = '🔒';
            } else {
                passwordInput.type = 'password';
                this.innerText = '👁️';
            }
        });

        async function handleSignUpSubmit(event) {
            event.preventDefault();
            const regData = {
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                password: document.getElementById('regPassword').value,
                phoneBandhuId: createPhoneBandhuId()
            };

            try {
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(regData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    console.log('Your PhoneBandhu ID:', regData.phoneBandhuId);
                    alert(`🎉 Registration successful! Welcome, ${regData.name}.\nYour PhoneBandhu ID: ${result.user?.phoneBandhuId || regData.phoneBandhuId}`);
                    window.location.href = 'auth.html';
                } else {
                    alert(`⚠️ ${result.message || 'Registration failed!'}`);
                }
            } catch (err) {
                console.error("Signup error:", err);
                alert('🔌 Connection error! Please ensure your backend Node server is running.');
            }
        }
    </script>
</body>
</html>
